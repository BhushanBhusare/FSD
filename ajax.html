
<!DOCTYPE html>
<html>
<head>
    <title>AJAX Practical</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<h2>Random User Details</h2>

<button id="load">Fetch Data</button>

<div id="result"></div>

<script>

$("#load").click(function() {

    $("#result").html("Loading...");

    $.ajax({

        url: "https://randomuser.me/api/",
        type: "GET",
        dataType: "json",

        // Success
        success: function(data) {

            let user = data.results[0];

            $("#result").html(
                "Name: " + user.name.first + " " + user.name.last +
                "<br>Email: " + user.email +
                "<br>Country: " + user.location.country
            );
        },

        // Error
        error: function() {
            $("#result").html("Unable to fetch data");
        }

    });

});

</script>
</body>
</html>
