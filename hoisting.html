
<!DOCTYPE html>
<html>
<head>
    <title>Hoisting and Scope</title>
</head>
<body>

<h2>JavaScript Hoisting</h2>
<p>Open Console using F12 to see output.</p>

<script>

// Variable Hoisting
console.log(x);
var x = 10;

// Function Hoisting
greet();

function greet() {
    console.log("Hello JavaScript");
}

// Difference between var, let and const
var a = 10;
let b = 20;
const c = 30;

console.log("Var:", a);
console.log("Let:", b);
console.log("Const:", c);

// Block Scope
{
    let p = 40;
    const q = 50;
    console.log(p, q);
}

</script>
</body>
</html>
