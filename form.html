
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center text-primary">Registration Form</h2>

    <form id="form" novalidate>

        <label class="form-label">Name</label>
        <input type="text" id="name" class="form-control mb-2" required>

        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control mb-2" required>

        <label class="form-label">Password</label>
        <input type="password" id="pass" class="form-control mb-2"
               minlength="6" required>

        <button class="btn btn-primary mt-2">Register</button>

    </form>

    <p id="msg" class="mt-3"></p>

</div>

<script>
document.getElementById("form").onsubmit = function(e) {

    e.preventDefault();

    let n = document.getElementById("name");
    let email = document.getElementById("email");
    let p = document.getElementById("pass");

    if(!this.checkValidity()) {
        this.classList.add("was-validated");
        document.getElementById("msg").innerHTML = "Invalid Details";
        return;
    }

    document.getElementById("msg").innerHTML =
        "Registration Successful!";

    this.reset();
    this.classList.remove("was-validated");
};
</script>

</body>
</html>
